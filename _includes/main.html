<div class="deck-shell">
    <div class="deck-main">
        <div class="deck-header">
            <div class="deck-logo">SD</div>
            <div>
                <div class="deck-title">Deck Library</div>
                <div class="deck-sub">Handheld-style UI • dark mode</div>
            </div>
        </div>

        <div class="deck-cards">
            <div class="deck-card">
                <div class="card-art">ARTWORK</div>
                <div class="card-row">
                    <div>
                        <div class="card-title">Game One</div>
                        <div class="card-meta">Adventure · 3h play</div>
                    </div>
                    <button class="deck-btn deck-btn--primary">Play</button>
                </div>
            </div>

            <div class="deck-card">
                <div class="card-art">ARTWORK</div>
                <div class="card-row">
                    <div>
                        <div class="card-title">Racing XR</div>
                        <div class="card-meta">Racing · 1.5 GB</div>
                    </div>
                    <button class="deck-btn deck-btn--ghost">Details</button>
                </div>
            </div>

            <div class="deck-card">
                <div class="card-art">ARTWORK</div>
                <div class="card-row">
                    <div>
                        <div class="card-title">Puzzle Lab</div>
                        <div class="card-meta">Puzzle · 200 MB</div>
                    </div>
                    <button class="deck-btn">Manage</button>
                </div>
            </div>
        </div>
    </div>

    <aside class="deck-controls">
        <div class="deck-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                <div>
                    <div class="small text-muted">Battery</div>
                    <div style="font-weight:700">78%</div>
                </div>
                <div style="width:120px">
                    <div class="deck-progress"><i style="width:78%"></i></div>
                </div>
            </div>

            <div style="display:flex;gap:8px;margin-bottom:12px">
                <button class="deck-btn deck-btn--primary">Quick Resume</button>
                <button class="deck-btn deck-btn--ghost">Settings</button>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center">
                <div>
                    <div class="small text-muted">Mode</div>
                    <div class="deck-toggle" role="tablist">
                        <button class="is-active">Handheld</button>
                        <button>Docked</button>
                        <button>Tabletop</button>
                    </div>
                </div>

                <div class="control-stick" title="Analog"></div>
            </div>
        </div>

        <div class="deck-panel">
            <div class="small text-muted">Downloads</div>
            <div style="height:10px"></div>
            <div class="deck-progress"><i style="width:34%"></i></div>
            <div style="margin-top:12px" class="text-muted small">1 active • 2 queued</div>
        </div>
    </aside>
</div>
